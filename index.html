<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Edenrise B-roll Cockpit</title>
<link rel="stylesheet" href="style.css?v=20261029a">
</head>
<body>
<header class="topbar">
  <div class="bar">
    <button id="lessonbtn" class="lessonbtn" title="Choose a lesson (shortcut: L)">
      <span class="lb-text">
        <span class="lb-kicker" id="lbclient">Lesson</span>
        <span class="lb-title" id="lbtitle">Loading…</span>
      </span>
      <span class="lb-caret">▾</span>
    </button>
    <div class="lessonprog">
      <div class="lp-text" id="stat"></div>
      <div class="lp-track"><div class="lp-fill" id="lpfill"></div></div>
    </div>
    <div class="spacer"></div>
    <button id="conn" class="connpill" title="Where your ticks are saved">…</button>
    <button id="finalise" class="finalise">✓ Mark finished</button>
    <button id="send" class="send">Send to editor ▸</button>
    <div class="more">
      <button id="morebtn" class="morebtn" title="More">⋯</button>
      <div id="moremenu" class="moremenu" hidden>
        <a href="review.html">🎞 Review desk</a>
        <a href="library.html">📚 Footage library</a>
        <button id="download">⬇ Download my picks (file)</button>
        <button id="connect">🔑 Change access key</button>
      </div>
    </div>
  </div>
  <nav id="scenenav" class="scenenav" aria-label="Scenes"></nav>
</header>

<div id="drawerbg" class="drawerbg" hidden></div>
<aside id="drawer" class="drawer" hidden aria-label="Lessons">
  <div class="dr-head">
    <div class="dr-top"><b>Lessons</b><button id="drawerx" class="linkbtn">close ✕</button></div>
    <div class="dr-prog"><span id="drprogtxt"></span><div class="lp-track"><div class="lp-fill" id="drprogfill"></div></div></div>
    <input id="lessonsearch" class="search" type="search" placeholder="Search lessons…" autocomplete="off">
    <label class="dr-hide"><input type="checkbox" id="hidedone"> Hide finished lessons</label>
  </div>
  <div id="lessonlist" class="dr-list"></div>
</aside>

<main id="scenes"><p class="muted pad">Loading…</p></main>

<div id="toast" class="toast"></div>
<script src="app.js?v=20261029a"></script>

  <div id="connectdlg" class="dlg" hidden>
    <div class="dlgbox">
      <h3>Connect this device</h3>
      <p class="muted">Paste the access key so your ticks save straight to the repo.
         Stored only in this browser.</p>
      <label>Owner<input id="c_owner" value="Angel-Team7" autocapitalize="off" autocorrect="off" spellcheck="false"></label>
      <label>Repository<input id="c_repo" value="CAA-Broll-Studio" autocapitalize="off" autocorrect="off" spellcheck="false"></label>
      <label>Branch<input id="c_branch" value="main" autocapitalize="off" autocorrect="off" spellcheck="false"></label>
      <label>Access key
        <textarea id="c_token" rows="3" placeholder="github_pat_…"
          autocapitalize="off" autocorrect="off" spellcheck="false"></textarea></label>
      <p id="c_msg" class="cmsg"></p>
      <div class="dlgrow">
        <button id="c_cancel" class="link">Cancel</button>
        <button id="c_go" class="primary">Connect</button>
      </div>
    </div>
  </div>
</body>
</html>
