name: Search 10 more

# Fires when the cockpit commits a top-up request (the 🔎 / 🔁 buttons), and can be
# run by hand from the Actions tab. Never fires on its own commits.
on:
  push:
    branches: [main]
    paths: ['selections/**.json']
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # lets a run re-queue itself when more requests are waiting

concurrency:
  group: search-10-more        # queue runs; never let two rewrite scenes.json at once
  cancel-in-progress: false

jobs:
  topup:
    if: "!contains(github.event.head_commit.message, '[topup-bot]')"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout (sparse, blobless)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            selections
            tools
            .github
          sparse-checkout-cone-mode: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # apt-get install ffmpeg took 1125s of a 1212s run. A static build is ~40 MB
      # and is cached between runs, so this drops to seconds.
      - name: Cache ffmpeg
        id: ffcache
        uses: actions/cache@v4
        with:
          path: ~/ffbin
          key: ffmpeg-static-v1

      - name: Install deps
        run: |
          python -m pip install --quiet requests
          if [ ! -x "$HOME/ffbin/ffmpeg" ]; then
            mkdir -p "$HOME/ffbin"
            curl -sSL --retry 3 -o /tmp/ff.tar.xz \
              https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
            tar -xJf /tmp/ff.tar.xz -C /tmp
            cp /tmp/ffmpeg-*-static/ffmpeg /tmp/ffmpeg-*-static/ffprobe "$HOME/ffbin/" \
              || { echo "static build unavailable - falling back to apt"; \
                   sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }
          fi
          if [ -x "$HOME/ffbin/ffmpeg" ]; then echo "$HOME/ffbin" >> "$GITHUB_PATH"; fi
          "$HOME/ffbin/ffmpeg" -version 2>/dev/null | head -1 || ffmpeg -version | head -1

      - name: Fetch fresh candidates
        id: bot
        env:
          PEXELS_API_KEY:  ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          COVERR_API_KEY:  ${{ secrets.COVERR_API_KEY }}
          TOPUP_VIDEOS: '10'
        run: |
          python tools/topup_bot.py | tee /tmp/bot.log
          echo "added=$(grep -oP 'TOTAL_ADDED=\K[0-9]+' /tmp/bot.log || echo 0)" >> "$GITHUB_OUTPUT"
          echo "left=$(grep -oP 'LEFT=\K[0-9]+' /tmp/bot.log || echo 0)" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.bot.outputs.added != '0'
        run: |
          git config user.name  "broll-bot"
          git config user.email "bot@edenrise.com"
          git add selections projects
          git commit -m "[topup-bot] Search 10 more: +${{ steps.bot.outputs.added }} candidates"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then echo "pushed"; exit 0; fi
            echo "push rejected - rebasing on origin/main (attempt $i)"
            git fetch origin main && git rebase origin/main || git rebase --abort
            sleep $((i * 5))
          done
          echo "::error::could not push after 5 attempts"; exit 1

      - name: Re-queue for the requests that did not fit this run
        if: steps.bot.outputs.left != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run search-10-more.yml --ref main || echo "::warning::could not re-queue; the next click will pick them up"

      - name: Summary
        run: |
          {
            echo "### Search 10 more"
            echo ""
            if [ "${{ steps.bot.outputs.added }}" = "0" ]; then
              echo "No pending requests, or no new candidates were found."
            else
              echo "Added **${{ steps.bot.outputs.added }}** fresh video candidates."
              echo ""
              echo "They appear on the cockpit card once GitHub Pages rebuilds (a few minutes)."
              echo "New clips carry a **NEW** badge until you approve or replace them."
            fi
            echo ""
            echo '```'
            tail -40 /tmp/bot.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
