name: Harvest B-roll

# Stocks the shared library ahead of demand so 🔎 / 🔁 promote off the shelf.
# Hourly, every day (UTC). Runs entirely on GitHub; no Mac involved.
on:
  # a script intake (the Claude routine committing new/changed cards) starts a gather
  push:
    branches: [main]
    paths: ['projects/**/scenes.json']
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      budget:
        description: 'New clips to harvest this run'
        default: '30'

permissions:
  contents: write

concurrency:
  group: harvest
  cancel-in-progress: false

jobs:
  harvest:
    if: "!contains(github.event.head_commit.message, '[harvest-bot]') && !contains(github.event.head_commit.message, '[judge-bot]') && !contains(github.event.head_commit.message, '[topup-bot]')"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            library
            projects
            tools
            .github
          sparse-checkout-cone-mode: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache ffmpeg
        uses: actions/cache@v4
        with:
          path: ~/ffbin
          key: ffmpeg-static-v1

      - name: Install deps
        run: |
          python -m pip install --quiet requests Pillow
          if [ ! -x "$HOME/ffbin/ffmpeg" ]; then
            mkdir -p "$HOME/ffbin"
            curl -sSL --retry 3 -o /tmp/ff.tar.xz https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz \
              && tar -xJf /tmp/ff.tar.xz -C /tmp \
              && cp /tmp/ffmpeg-*-static/ffmpeg /tmp/ffmpeg-*-static/ffprobe "$HOME/ffbin/" \
              || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }
          fi
          [ -x "$HOME/ffbin/ffmpeg" ] && echo "$HOME/ffbin" >> "$GITHUB_PATH"

      - name: Harvest
        id: h
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PEXELS_API_KEY:  ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          COVERR_API_KEY:  ${{ secrets.COVERR_API_KEY }}
          HARVEST_BUDGET: ${{ github.event.inputs.budget || '30' }}
        run: |
          python tools/harvest_cloud.py | tee /tmp/h.log
          echo "n=$(grep -oP 'HARVESTED=\K[0-9]+' /tmp/h.log || echo 0)" >> "$GITHUB_OUTPUT"

      - name: Commit the index
        if: steps.h.outputs.n != '0'
        run: |
          git config user.name broll-bot && git config user.email bot@edenrise.com
          git add library
          git commit -m "[harvest-bot] stocked ${{ steps.h.outputs.n }} clips into the shared library"
          for i in 1 2 3 4 5; do
            git push origin HEAD:main && exit 0
            git fetch origin main && git rebase origin/main || git rebase --abort; sleep $((i*5))
          done; exit 1

      - name: Summary
        run: |
          { echo "### Harvest"; echo; echo "New clips: **${{ steps.h.outputs.n }}**"; echo; echo '```'; tail -30 /tmp/h.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
